name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    name: Validate with HACS Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Topics (home-assistant, homeassistant, hacs, hacs-integration) must be set
          # manually in the repository Settings → About section, as GITHUB_TOKEN cannot
          # write repository metadata. Remove this ignore line after setting topics.
          ignore: topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
